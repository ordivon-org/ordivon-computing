schema_version: 1
project: agent-native-computing
status: p0-foundation

baseline:
  model_architecture:
    statement: Transformer-family models form the current mainstream operational starting point.
    epistemic_status: working_fact
    evolution: The baseline follows new architectures, evidence, and observed workloads.

branches:
  - id: ANC-MODEL
    name: model-and-cognitive-computation
  - id: ANC-IR
    name: agent-language-and-ir
  - id: ANC-COMPILER
    name: agent-compiler
  - id: ANC-KERNEL
    name: agent-execution-kernel
  - id: ANC-MEMORY
    name: memory-and-state
  - id: ANC-EFFECT
    name: tools-capabilities-and-effects
  - id: ANC-MULTI
    name: multi-agent-systems
  - id: ANC-HARDWARE
    name: hardware-isa-and-dataflow
  - id: ANC-VERIFY
    name: verification-and-benchmarks
  - id: ANC-ORG
    name: organization-economics-and-coordination

questions:
  - id: ANC-IR-001
    title: Minimum useful Agent Effect IR
    branch: ANC-IR
    status: open
    epistemic_status: research_question
    question: What is the smallest representation that expresses goals, capabilities, effects, commit conditions, retries, and recovery across models and runtimes?
    evidence_paths:
      - literature
      - executable_prototype
      - comparative_experiment
    related_projects:
      - Ordivon

  - id: ANC-MEMORY-001
    title: Minimum durable state for long-running task continuity
    branch: ANC-MEMORY
    status: open
    epistemic_status: research_question
    question: What durable state allows a different model instance to understand and continue a long-running task across context and session boundaries?
    evidence_paths:
      - failure_traces
      - recovery_experiments
      - state_minimization_study
    related_projects:
      - Ordivon
      - FinHarness

  - id: ANC-EFFECT-001
    title: Tool-contract change detection and negotiation
    branch: ANC-EFFECT
    status: open
    epistemic_status: research_question
    question: How can a host, agent, and live runtime detect, classify, review, and atomically adopt tool-contract changes during a long-lived session?
    evidence_paths:
      - protocol_analysis
      - reproduced_change_case
      - compatibility_matrix
      - prototype
    related_projects:
      - Ordivon
