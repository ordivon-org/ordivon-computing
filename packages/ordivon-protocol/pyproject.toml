[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-protocol"
version = "0.1.0"
description = "Stable protocol and semantic-state primitives promoted from Ordivon Computing experiments."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
