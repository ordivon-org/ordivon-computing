[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-observation-core"
version = "0.1.0"
description = "Owner-native metadata observation contracts, export bundles, selection, and rebuildable in-process querying for Ordivon."
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
