name: Deterministic contracts

on:
  pull_request:
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - "packages/ordivon-protocol/**"
      - "incubation/host-v0/**"
      - "research/experiments/external-semantic-contract-v0/pyproject.toml"
      - "research/experiments/external-semantic-contract-v0/integration/**"
      - "research/experiments/external-semantic-contract-v0/tests/**"
      - "research/experiments/external-semantic-contract-v0/schemas/**"
      - "research/experiments/external-semantic-contract-v0/fixtures/**"
      - "research/experiments/external-semantic-contract-v0/rust/**"
      - "research/experiments/external-semantic-contract-v0/scripts/**"
      - "research/experiments/semantic-core-v0/pyproject.toml"
      - "research/experiments/semantic-core-v0/src/**"
      - "research/experiments/semantic-core-v0/tests/**"
      - "research/experiments/semantic-core-v0/scripts/**"
      - "research/experiments/task-continuation-v0/pyproject.toml"
      - "research/experiments/task-continuation-v0/src/**"
      - "research/experiments/task-continuation-v0/tests/**"
      - "research/experiments/task-continuation-v0/scripts/**"
      - "research/experiments/task-continuation-v0/fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - "packages/ordivon-protocol/**"
      - "incubation/host-v0/**"
      - "research/experiments/external-semantic-contract-v0/pyproject.toml"
      - "research/experiments/external-semantic-contract-v0/integration/**"
      - "research/experiments/external-semantic-contract-v0/tests/**"
      - "research/experiments/external-semantic-contract-v0/schemas/**"
      - "research/experiments/external-semantic-contract-v0/fixtures/**"
      - "research/experiments/external-semantic-contract-v0/rust/**"
      - "research/experiments/external-semantic-contract-v0/scripts/**"
      - "research/experiments/semantic-core-v0/pyproject.toml"
      - "research/experiments/semantic-core-v0/src/**"
      - "research/experiments/semantic-core-v0/tests/**"
      - "research/experiments/semantic-core-v0/scripts/**"
      - "research/experiments/task-continuation-v0/pyproject.toml"
      - "research/experiments/task-continuation-v0/src/**"
      - "research/experiments/task-continuation-v0/tests/**"
      - "research/experiments/task-continuation-v0/scripts/**"
      - "research/experiments/task-continuation-v0/fixtures/**"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --disable-pip-version-check ruff==0.15.14
      - name: Static checks
        run: |
          python -m compileall -q \
            packages/ordivon-protocol/src \
            packages/ordivon-protocol/tests \
            incubation/host-v0/src \
            incubation/host-v0/tests \
            research/experiments/external-semantic-contract-v0/integration \
            research/experiments/external-semantic-contract-v0/tests \
            research/experiments/external-semantic-contract-v0/scripts \
            research/experiments/semantic-core-v0/src \
            research/experiments/semantic-core-v0/tests \
            research/experiments/semantic-core-v0/scripts \
            research/experiments/task-continuation-v0/src \
            research/experiments/task-continuation-v0/tests \
            research/experiments/task-continuation-v0/scripts
          ruff check \
            packages/ordivon-protocol/src \
            packages/ordivon-protocol/tests \
            incubation/host-v0/src \
            incubation/host-v0/tests \
            research/experiments/external-semantic-contract-v0/integration \
            research/experiments/external-semantic-contract-v0/tests \
            research/experiments/external-semantic-contract-v0/scripts \
            research/experiments/semantic-core-v0/src \
            research/experiments/semantic-core-v0/tests \
            research/experiments/semantic-core-v0/scripts \
            research/experiments/task-continuation-v0/src \
            research/experiments/task-continuation-v0/tests \
            research/experiments/task-continuation-v0/scripts
      - name: Promoted protocol tests
        working-directory: packages/ordivon-protocol
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: External contract tests
        working-directory: research/experiments/external-semantic-contract-v0
        env:
          PYTHONPATH: ../../../packages/ordivon-protocol/src:../semantic-core-v0/src:.
        run: python -m unittest discover -s tests
      - name: Semantic Kernel tests
        working-directory: research/experiments/semantic-core-v0
        env:
          PYTHONPATH: ../../../packages/ordivon-protocol/src:src
        run: python -m unittest discover -s tests
      - name: Task continuation tests
        working-directory: research/experiments/task-continuation-v0
        env:
          PYTHONPATH: ../../../packages/ordivon-protocol/src:src:../external-semantic-contract-v0:../semantic-core-v0/src
        run: python -m unittest discover -s tests
      - name: Host incubator boundary tests
        working-directory: incubation/host-v0
        env:
          PYTHONPATH: src:../../packages/ordivon-protocol/src
        run: python -m unittest discover -s tests
      - name: Cross-language canonical vectors
        working-directory: research/experiments/external-semantic-contract-v0
        run: |
          rustc --edition=2021 rust/canonical-verifier/main.rs -o /tmp/anc-canonical-verifier
          /tmp/anc-canonical-verifier fixtures/canonical/canonical-vectors.tsv
