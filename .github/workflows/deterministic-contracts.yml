name: Deterministic contracts

on:
  pull_request:
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - ".ordivon/**"
      - "README.md"
      - "core/**"
      - "knowledge/**"
      - "packages/**"
      - "projects/**"
      - "research/**"
      - "scripts/**"
      - "docs/**"
      - "studies/**"
      - ".vale.ini"
      - ".markdownlint-cli2.yaml"
      - ".cspell.json"
      - "lychee.toml"
      - "mise.toml"
      - "TESTING.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - ".ordivon/**"
      - "README.md"
      - "core/**"
      - "knowledge/**"
      - "packages/**"
      - "projects/**"
      - "research/**"
      - "scripts/**"
      - "docs/**"
      - "studies/**"
      - ".vale.ini"
      - ".markdownlint-cli2.yaml"
      - ".cspell.json"
      - "lychee.toml"
      - "mise.toml"
      - "TESTING.md"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: python -m pip install --disable-pip-version-check uv==0.11.6
      - name: Computing conformance gate
        run: |
          python scripts/run_conformance_gate.py \
            --receipt /tmp/ordivon-conformance-receipt.json
