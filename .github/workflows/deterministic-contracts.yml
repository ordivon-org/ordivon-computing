name: Deterministic contracts

on:
  pull_request:
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - "packages/ordivon-protocol/**"
      - "incubation/host-v0/**"
      - "projects/conformance.toml"
      - "projects/registry.yaml"
      - "scripts/ordivon_conformance.py"
      - "research/evidence/**"
      - "research/experiments/external-semantic-contract-v0/pyproject.toml"
      - "research/experiments/external-semantic-contract-v0/integration/**"
      - "research/experiments/external-semantic-contract-v0/tests/**"
      - "research/experiments/external-semantic-contract-v0/fixtures/**"
      - "research/experiments/external-semantic-contract-v0/rust/**"
      - "research/experiments/external-semantic-contract-v0/scripts/**"
      - "research/experiments/semantic-core-v0/pyproject.toml"
      - "research/experiments/semantic-core-v0/src/**"
      - "research/experiments/semantic-core-v0/tests/**"
      - "research/experiments/semantic-core-v0/scripts/**"
      - "research/experiments/task-continuation-v0/pyproject.toml"
      - "research/experiments/task-continuation-v0/src/**"
      - "research/experiments/task-continuation-v0/tests/**"
      - "research/experiments/task-continuation-v0/scripts/**"
      - "research/experiments/task-continuation-v0/fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - "packages/ordivon-protocol/**"
      - "incubation/host-v0/**"
      - "projects/conformance.toml"
      - "projects/registry.yaml"
      - "scripts/ordivon_conformance.py"
      - "research/evidence/**"
      - "research/experiments/external-semantic-contract-v0/pyproject.toml"
      - "research/experiments/external-semantic-contract-v0/integration/**"
      - "research/experiments/external-semantic-contract-v0/tests/**"
      - "research/experiments/external-semantic-contract-v0/fixtures/**"
      - "research/experiments/external-semantic-contract-v0/rust/**"
      - "research/experiments/external-semantic-contract-v0/scripts/**"
      - "research/experiments/semantic-core-v0/pyproject.toml"
      - "research/experiments/semantic-core-v0/src/**"
      - "research/experiments/semantic-core-v0/tests/**"
      - "research/experiments/semantic-core-v0/scripts/**"
      - "research/experiments/task-continuation-v0/pyproject.toml"
      - "research/experiments/task-continuation-v0/src/**"
      - "research/experiments/task-continuation-v0/tests/**"
      - "research/experiments/task-continuation-v0/scripts/**"
      - "research/experiments/task-continuation-v0/fixtures/**"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --disable-pip-version-check ruff==0.15.14
      - name: Computing conformance gate
        run: |
          python scripts/ordivon_conformance.py gate \
            --receipt /tmp/ordivon-conformance-receipt.json
