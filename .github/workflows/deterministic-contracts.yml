name: Deterministic contracts

on:
  pull_request:
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - ".ordivon/**"
      - ".vale/**"
      - "README.md"
      - "core/**"
      - "knowledge/**"
      - "packages/**"
      - "projects/**"
      - "research/**"
      - "scripts/**"
      - "docs/**"
      - "studies/**"
      - ".vale.ini"
      - ".markdownlint-cli2.yaml"
      - ".cspell.json"
      - "lychee.toml"
      - "mise.toml"
      - "TESTING.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - ".ordivon/**"
      - ".vale/**"
      - "README.md"
      - "core/**"
      - "knowledge/**"
      - "packages/**"
      - "projects/**"
      - "research/**"
      - "scripts/**"
      - "docs/**"
      - "studies/**"
      - ".vale.ini"
      - ".markdownlint-cli2.yaml"
      - ".cspell.json"
      - "lychee.toml"
      - "mise.toml"
      - "TESTING.md"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      - run: python -m pip install --disable-pip-version-check uv==0.11.6
      - name: Computing conformance gate
        run: |
          python scripts/run_conformance_gate.py \
            --receipt /tmp/ordivon-conformance-receipt.json
