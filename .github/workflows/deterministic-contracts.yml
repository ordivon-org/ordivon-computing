name: Deterministic contracts

on:
  pull_request:
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - "README.md"
      - "core/**"
      - "knowledge/**"
      - "studies/**"
      - "packages/ordivon-protocol/**"
      - "packages/content-contract/**"
      - "packages/content-cli/**"
      - "packages/content-templates/**"
      - "packages/content-fixtures/**"
      - "docs/content-engineering/**"
      - ".ordivon/**"
      - ".vale.ini"
      - ".markdownlint-cli2.yaml"
      - ".cspell.json"
      - "lychee.toml"
      - "mise.toml"
      - "projects/conformance.toml"
      - "projects/registry.yaml"
      - "research/README.md"
      - "research/portfolio.json"
      - "research/PORTFOLIO.md"
      - "research/charters/**"
      - "research/map.yaml"
      - "research/questions/**"
      - "research/evidence/**"
      - "research/experiments/harness-evaluation-v0/**"
      - "scripts/check_foundational_docs.py"
      - "scripts/check_research_portfolio.py"
      - "scripts/render_research_portfolio.py"
      - "scripts/check_protocol_release.py"
      - "scripts/check_protocol_consumers.py"
      - "scripts/ordivon_content.py"
      - "scripts/ordivon_conformance.py"
      - "TESTING.md"
      - "projects/README.md"
      - "research/experiments/README.md"
      - "research/COMPUTER-P0-P1-A-SERIES-AUDIT.md"
      - "research/experiments/external-semantic-contract-v0/pyproject.toml"
      - "research/experiments/external-semantic-contract-v0/integration/**"
      - "research/experiments/external-semantic-contract-v0/tests/**"
      - "research/experiments/external-semantic-contract-v0/fixtures/**"
      - "research/experiments/external-semantic-contract-v0/rust/**"
      - "research/experiments/external-semantic-contract-v0/scripts/**"
      - "research/experiments/semantic-core-v0/pyproject.toml"
      - "research/experiments/semantic-core-v0/src/**"
      - "research/experiments/semantic-core-v0/tests/**"
      - "research/experiments/semantic-core-v0/scripts/**"
      - "research/experiments/task-continuation-v0/pyproject.toml"
      - "research/experiments/task-continuation-v0/src/**"
      - "research/experiments/task-continuation-v0/tests/**"
      - "research/experiments/task-continuation-v0/scripts/**"
      - "research/experiments/task-continuation-v0/fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deterministic-contracts.yml"
      - "README.md"
      - "core/**"
      - "knowledge/**"
      - "studies/**"
      - "packages/ordivon-protocol/**"
      - "packages/content-contract/**"
      - "packages/content-cli/**"
      - "packages/content-templates/**"
      - "packages/content-fixtures/**"
      - "docs/content-engineering/**"
      - ".ordivon/**"
      - ".vale.ini"
      - ".markdownlint-cli2.yaml"
      - ".cspell.json"
      - "lychee.toml"
      - "mise.toml"
      - "projects/conformance.toml"
      - "projects/registry.yaml"
      - "research/README.md"
      - "research/portfolio.json"
      - "research/PORTFOLIO.md"
      - "research/charters/**"
      - "research/map.yaml"
      - "research/questions/**"
      - "research/evidence/**"
      - "research/experiments/harness-evaluation-v0/**"
      - "scripts/check_foundational_docs.py"
      - "scripts/check_research_portfolio.py"
      - "scripts/render_research_portfolio.py"
      - "scripts/check_protocol_release.py"
      - "scripts/check_protocol_consumers.py"
      - "scripts/ordivon_content.py"
      - "scripts/ordivon_conformance.py"
      - "TESTING.md"
      - "projects/README.md"
      - "research/experiments/README.md"
      - "research/COMPUTER-P0-P1-A-SERIES-AUDIT.md"
      - "research/experiments/external-semantic-contract-v0/pyproject.toml"
      - "research/experiments/external-semantic-contract-v0/integration/**"
      - "research/experiments/external-semantic-contract-v0/tests/**"
      - "research/experiments/external-semantic-contract-v0/fixtures/**"
      - "research/experiments/external-semantic-contract-v0/rust/**"
      - "research/experiments/external-semantic-contract-v0/scripts/**"
      - "research/experiments/semantic-core-v0/pyproject.toml"
      - "research/experiments/semantic-core-v0/src/**"
      - "research/experiments/semantic-core-v0/tests/**"
      - "research/experiments/semantic-core-v0/scripts/**"
      - "research/experiments/task-continuation-v0/pyproject.toml"
      - "research/experiments/task-continuation-v0/src/**"
      - "research/experiments/task-continuation-v0/tests/**"
      - "research/experiments/task-continuation-v0/scripts/**"
      - "research/experiments/task-continuation-v0/fixtures/**"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: python -m pip install --disable-pip-version-check ruff==0.15.14 jsonschema==4.25.1
      - name: Computing conformance gate
        run: |
          python scripts/ordivon_conformance.py gate \
            --receipt /tmp/ordivon-conformance-receipt.json
