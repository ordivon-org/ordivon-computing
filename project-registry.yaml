schema_version: 1
registry: agent-native-computing-projects

projects:
  - id: agent-native-computing
    repository: https://github.com/zycxfyh/agent-native-computing
    role: research-root
    maturity: foundation
    focus:
      - working-foundations
      - computing-stack-map
      - research-question-map
      - cross-project-connections

  - id: Ordivon
    repository: https://github.com/zycxfyh/Ordivon
    role: agent-execution-microkernel
    maturity: dogfood
    branches:
      - ANC-KERNEL
      - ANC-EFFECT
      - ANC-MEMORY
    focus:
      - workspace-identity
      - task-and-attempt-lifecycle
      - mutation-preconditions
      - execution-isolation
      - artifacts
      - cancellation
      - recovery-semantics

  - id: FinHarness
    repository: https://github.com/zycxfyh/FinHarness
    role: capital-governance-domain-system
    maturity: active
    branches:
      - ANC-EFFECT
      - ANC-VERIFY
      - ANC-ORG
    focus:
      - capital-truth
      - authority
      - decision-state
      - execution-identity
      - reconciliation

  - id: ordinary-prosperity-research
    repository: https://github.com/zycxfyh/ordinary-prosperity-research
    role: long-horizon-empirical-research-project
    maturity: active
    branches:
      - ANC-MULTI
      - ANC-VERIFY
      - ANC-ORG
    focus:
      - project-specific-research-questions
      - empirical-analysis
      - reproducible-research-artifacts

  - id: ordivon-web
    repository: https://github.com/zycxfyh/ordivon-web
    role: public-interface-and-project-navigation
    maturity: early
    branches:
      - ANC-ORG
    focus:
      - public-presentation
      - project-navigation
