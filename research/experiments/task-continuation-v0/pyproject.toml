[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-task-continuation"
version = "0.1.0"
description = "Executable TaskCapsule and fresh-Host continuation reference experiment."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["ordivon-protocol==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
