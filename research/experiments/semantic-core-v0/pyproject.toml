[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-semantic-core"
version = "0.1.0"
description = "Executable reference semantics for Agent-native effects, evidence, identity, and recovery."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
