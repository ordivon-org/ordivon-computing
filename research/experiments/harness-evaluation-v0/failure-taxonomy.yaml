schemaVersion: 1
kind: ordivon.evaluation-failure-taxonomy

classes:
  CONTEXT:
    - stale_source
    - stale_assignment
    - missing_fact
    - provenance_lost
    - goal_drift
  MODEL:
    - invalid_output
    - false_completion
    - premature_stop
    - repeated_plan
  TOOL:
    - invalid_arguments
    - unsupported_capability
    - partial_observation
    - schema_drift
  EFFECT:
    - unknown_delivery
    - duplicate_effect
    - reconciliation_failed
  HARNESS:
    - result_misrouting
    - budget_error
    - loop_nontermination
    - state_loss
  VERIFIER:
    - false_accept
    - false_reject
    - flaky_assertion
    - hidden_requirement
  ENVIRONMENT:
    - nondeterminism
    - resource_exhaustion
    - leaked_state

rules:
  - Record the earliest observable failure, not only the final symptom.
  - Attribute responsibility to the boundary that can detect or repair the failure with the least duplicated authority.
  - A recovered fault remains a Failure Record when it changed cost, timing, or control flow.
  - Unknown delivery is not equivalent to execution failure and must not trigger blind redispatch.
  - A verifier defect invalidates the affected capability comparison until the Task is repaired and rerun.
