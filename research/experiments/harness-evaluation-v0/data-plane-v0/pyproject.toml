[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ordivon-eval-data"
version = "0.1.0"
description = "Rebuildable local analytics and MLflow projection for Ordivon evaluation evidence."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb==1.5.5",
  "mlflow==3.15.1",
  "pyarrow==25.0.0",
]

[project.scripts]
ordivon-eval-data = "ordivon_eval_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ordivon_eval_data"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
