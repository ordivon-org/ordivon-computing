[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-observation-core"
version = "0.1.0"
description = "Experimental metadata-only Observation contracts and in-process Gateway for Ordivon Computing."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[tool.setuptools]
packages = ["ordivon_observation_core"]
