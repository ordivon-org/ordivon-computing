[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-external-semantic-contract"
version = "0.1.0"
description = "Backend-neutral Effect IR, Tool contracts, and immutable Effect bindings."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
