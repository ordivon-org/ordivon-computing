[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-adversarial-range"
version = "0.1.0"
description = "Minimal owned adversarial range for Agent hijacking, ambiguous retry, and interpretation differential experiments."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
anc-adversarial-range = "anc_adversarial_range.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
