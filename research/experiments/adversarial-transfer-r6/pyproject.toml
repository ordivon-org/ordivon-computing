[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-adversarial-transfer-r6"
version = "0.1.0"
description = "Real-model Ordivon Host/Harness adversarial transfer experiment over owned Canary resources."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
anc-adversarial-transfer-r6 = "anc_adversarial_transfer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
