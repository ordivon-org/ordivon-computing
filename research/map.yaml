    meaning: Capability compilation requires stable Tool identity, Effect semantics, authority, and contract-change handling.
  - from: ANC-MULTI-001
    type: feeds_back_to
    to: ANC-ADAPT-001
    meaning: Real ownership, handoff, duplication, and Join failures determine which coordination policies should adapt.
  - from: ANC-VERIFY-001
    type: enables
    to: ANC-ADAPT-001
    meaning: Replay, evaluation, counterfactual evidence, and rollback are required before a learned change can be promoted.
  - from: ANC-ADAPT-001
    type: feeds_back_to
