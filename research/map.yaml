    meaning: Multi-Agent ownership, wait, handoff, and Join experiments determine which coordination objects are reusable across game families.
  - from: ANC-GAME-001
    type: feeds_back_to
    to: ANC-VERIFY-001
    meaning: Scenario Cases, point-in-time replay, invalid-action evidence, and player interventions revise distributional Agent evaluation requirements.
questions:
  - id: ANC-STACK-001
    title: Classical substrate and Agent-native responsibility transition
    file: questions/ANC-STACK-001-classical-to-agent-native-transition.md
    branch: ANC-STACK
    epistemic_status: research_question
    question: Which responsibilities remain classical, which are only amplified by Agent workloads, and which become structurally new when probabilistic cognition selects and revises actions inside a persistent world-changing loop?
    evidence_paths:
      - primary_source_comparison
      - classical_baseline
      - cross_project_audit
      - falsification_experiment
    related_projects:
      - ordivon-computing
      - ordivon-host
      - ordivon-runtime
      - ordivon-game
      - ordivon-security

  - id: ANC-IR-001
    title: Minimum useful Agent Effect IR
    file: questions/ANC-IR-001-agent-effect-ir.md
    branch: ANC-IR
    epistemic_status: research_question
    question: What is the smallest representation that expresses targets, authority, effects, results, verification, and recovery across models and runtimes?
    evidence_paths:
      - literature
      - executable_prototype
      - comparative_experiment
    related_projects:
      - ordivon-runtime
      - ordivon-host

  - id: ANC-MEMORY-001
    title: Minimum durable state for open-work continuity
    file: questions/ANC-MEMORY-001-task-continuity.md
    branch: ANC-MEMORY
    epistemic_status: research_question
    question: What durable state allows a different model and fresh Host to understand, revise, and continue open work across context, process, provider, and world-version boundaries?
    evidence_paths:
      - failure_traces
      - recovery_experiments
      - durable_workflow_comparison
      - state_minimization_study
    related_projects:
      - ordivon-host
      - ordivon-runtime
      - ordivon-game

  - id: ANC-EFFECT-001
    title: Tool-contract change detection and adoption
    file: questions/ANC-EFFECT-001-tool-contract-evolution.md
    branch: ANC-EFFECT
    epistemic_status: research_question
    question: How can a Host, model, and live Runtime detect, classify, and adopt Tool-contract changes during long-lived work without silently changing Effect meaning?
