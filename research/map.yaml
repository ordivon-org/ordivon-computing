schema_version: 3
project: ordivon-computing

baseline:
  model_architecture:
    statement: Foundation models provide the current operational baseline for probabilistic cognition under selected context.
    epistemic_status: working_fact
    evolution: Stable responsibilities should survive model, provider, and harness replacement.
  substrate_boundary:
    statement: Mature classical systems remain authoritative for physical execution, isolation, transactions, transport, version control, model serving, and declared durable workflows.
    epistemic_status: working_structure
    evolution: Lower-layer implementation begins only after evidence demonstrates an unowned invariant or material bottleneck.
  repository_architecture:
    statement: Core, Knowledge, Studies, Research, and Projects form one knowledge-generation loop.
    epistemic_status: working_structure
  research_method:
    statement: Agent work is the primary observation surface; repeated formalizable burdens are mapped to their current responsibility carrier, tested against strong classical or simpler Agent baselines, and externalized only when a minimal structure produces recurring net value.
    epistemic_status: working_structure
    evolution: Human attention is reserved for purpose and consequence changes; routine private reversible research is Agent-led, and every retained externalization must preserve owner-native authority and an explicit deletion path.
  retention_presumption:
    statement: Existing persistent structures do not inherit active legitimacy; re-audit begins from removal from the active path and retains only the narrowest form with a current consumer and positive recurring net value.
    epistemic_status: working_structure
    evolution: Narrow the rule if repeated active removal causes greater unrecoverable loss, rediscovery cost, or participant capability loss than audited retention.

