relation_types:
  depends_on: The target cannot start or finish without the source.
  consumes: The target uses a contract, Artifact, or evidence produced by the source.
  produces: The source creates a contract, Artifact, or evidence used by the target.
  enables: The source removes a structural blocker for the target.
  feeds_back_to: Results from the source revise the target model or contract.

relations:
  - from: ANC-STACK-001
    type: feeds_back_to
    to: ANC-KERNEL-001
    meaning: Classical baselines and layer-admission tests constrain what may be claimed as a semantic Kernel invariant.
  - from: ANC-STACK-001
    type: feeds_back_to
    to: ANC-HOST-001
    meaning: The substrate-overlay boundary separates generic workflow durability from open-work, context, authority, and evidence responsibilities.
  - from: ANC-STACK-001
    type: feeds_back_to
    to: ANC-ORG-001
    meaning: Human purpose, consequence ownership, and attention are distinguished from ordinary user-interface or approval mechanisms.
  - from: ANC-KERNEL-001
    type: produces
    to: ANC-IR-001
    meaning: The closed Kernel v0 track produced semantic, authority, uncertainty, and recovery constraints that the public Effect IR must preserve.
  - from: ANC-IR-001
    type: feeds_back_to
    to: ANC-EFFECT-001
    meaning: Effect semantics determine which Tool-contract fields and compatibility classes matter.
  - from: ANC-EFFECT-001
    type: feeds_back_to
    to: ANC-IR-001
    meaning: Real Tool contracts expose missing or provider-specific assumptions in the Effect IR.
  - from: ANC-MEMORY-001
    type: feeds_back_to
    to: ANC-HOST-001
    meaning: Continuation and invalidation experiments determine what context the Host must compile.
  - from: ANC-HOST-001
    type: feeds_back_to
    to: ANC-MEMORY-001
    meaning: Host replacement and context compilation expose the minimum durable open-work state.
  - from: ANC-IR-001
    type: enables
    to: ANC-COMPILER-001
    meaning: Dynamic control needs stable Effect, wait, and evidence semantics before compiling revisable Task dataflow.
  - from: ANC-COMPILER-001
    type: enables
    to: ANC-MULTI-001
    meaning: Explicit branch, wait, and join control state supports independent Agent Attempts.
  - from: ANC-MULTI-001
    type: feeds_back_to
    to: ANC-COMPILER-001
    meaning: Real branch and Join workloads revise cognitive control and stopping policy.
  - from: ANC-MULTI-001
    type: enables
    to: ANC-ORG-001
    meaning: An operator workspace needs persistent branch, Artifact, comparison, and Join objects.
  - from: ANC-ORG-001
    type: feeds_back_to
    to: ANC-MULTI-001
    meaning: Human redirection and review reveal which coordination objects create value rather than overhead.
  - from: ANC-MEMORY-001
    type: enables
    to: ANC-ADAPT-001
    meaning: Cross-task learning requires durable trajectories and compact continuation state rather than raw conversation history.
  - from: ANC-EFFECT-001
    type: enables
