    meaning: Adaptation evidence revises context compilation, provider choice, stopping, and escalation policy.
  - from: ANC-GAME-001
    type: feeds_back_to
    to: ANC-HOST-001
    meaning: Game workloads expose the minimum reusable Actor, coordination, executor, authority, and verification extensions required without creating a second Host.
  - from: ANC-HOST-001
    type: enables
    to: ANC-GAME-001
    meaning: Durable Host contracts allow uncertain game policies to survive Provider and process replacement while deterministic World authority remains in Game.
  - from: ANC-MULTI-001
