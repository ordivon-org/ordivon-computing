    branches:
      - ANC-KERNEL
      - ANC-EFFECT
      - ANC-MEMORY
      - ANC-MULTI
    focus:
      - workspace-identity
      - task-and-attempt-lifecycle
      - atomic-mutation
      - asynchronous-execution
      - observations-and-artifacts
      - cancellation
      - recovery-semantics
      - tool-contract-evolution
