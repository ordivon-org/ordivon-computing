schema_version: 2
registry: ordivon-projects

# Stable project relationships only.
# Dynamic maturity, runtime status, releases, and deployment state belong to each project's own source of truth.

projects:
  - id: ordivon-computing
    repository: https://github.com/zycxfyh/ordivon-computing
    role: computing-research-structure-protocol-reference-and-conformance
    branches:
      - ANC-KERNEL
      - ANC-IR
      - ANC-EFFECT
      - ANC-VERIFY
    focus:
      - working-foundations
      - computing-stack-map
      - agent-native-primitives
      - reusable-knowledge
      - research-question-map
      - cross-project-synthesis

  - id: ordivon-runtime
    repository: https://github.com/zycxfyh/ordivon-runtime
    role: durable-execution-runtime-and-recovery-plane
    branches:
      - ANC-KERNEL
      - ANC-EFFECT
      - ANC-MEMORY
      - ANC-MULTI
    focus:
      - workspace-identity
      - task-and-attempt-lifecycle
      - atomic-mutation
      - asynchronous-execution
      - observations-and-artifacts
      - cancellation
      - recovery-semantics
      - tool-contract-evolution
    feedback:
      - multi-hour-engineering-trajectories
      - tool-contract-drift
      - progress-and-recovery-friction


  - id: ordivon-host
    repository: https://github.com/zycxfyh/ordivon-host
    role: durable-agent-host-control-plane-and-task-continuity
    branches:
      - ANC-HOST
      - ANC-KERNEL
      - ANC-EFFECT
      - ANC-VERIFY
      - ANC-MEMORY
    focus:
      - durable-goals-and-tasks
      - host-event-journal-and-projections
      - bounded-cognition-context
      - deterministic-decision-admission
      - runtime-dispatch-correlation
      - uncertain-outcome-reconciliation
      - independent-verification-and-task-outcomes
      - provider-replaceability
    feedback:
      - real-engineering-workload-friction
      - host-state-recovery
      - cognition-cost-and-context-quality
      - runtime-contract-evolution

  - id: ordivon-edge
    repository: https://github.com/zycxfyh/ordivon-edge
    role: connectivity-transport-and-overseas-execution-plane
    branches:
      - ANC-HOST
      - ANC-EFFECT
    focus:
      - path-observation
      - transport-selection
      - connection-recovery
      - remote-runtime-reachability
      - overseas-execution-entrypoint

  - id: FinHarness
    repository: https://github.com/zycxfyh/FinHarness
    role: capital-domain-agent-system
    branches:
      - ANC-EFFECT
      - ANC-VERIFY
      - ANC-ORG
      - ANC-MEMORY
    focus:
      - capital-truth
      - authority
      - decision-state
      - execution-identity
      - reconciliation
      - long-horizon-review

  - id: ordivon-game
    repository: https://github.com/zycxfyh/ordivon-game
    role: agent-native-game-and-virtual-world-testbed
    branches:
      - ANC-HOST
      - ANC-KERNEL
      - ANC-EFFECT
      - ANC-MULTI
      - ANC-ORG
    focus:
      - deterministic-world-kernel
      - persistent-agent-goals
      - typed-world-effects
      - multi-agent-coordination
      - authority-and-delegation
      - evidence-backed-replay
      - player-facing-agent-operations
    feedback:
      - agent-behaviour-legibility
      - cognition-cost-and-scheduling
      - multi-agent-conflict
      - world-state-consistency
      - long-horizon-virtual-world-continuity

  - id: ordivon-web
    repository: https://github.com/zycxfyh/ordivon-web
    role: public-interface-and-project-navigation
    branches:
