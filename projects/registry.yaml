      - multi-hour-engineering-trajectories
      - tool-contract-drift
      - progress-and-recovery-friction

  - id: FinHarness
    repository: https://github.com/zycxfyh/FinHarness
    role: capital-domain-agent-system
    maturity: active
    branches:
      - ANC-EFFECT
      - ANC-VERIFY
      - ANC-ORG
      - ANC-MEMORY
    focus:
      - capital-truth
      - authority
      - decision-state
      - execution-identity
      - reconciliation
      - long-horizon-review

  - id: ordinary-prosperity-research
    repository: https://github.com/zycxfyh/ordinary-prosperity-research
    role: long-horizon-empirical-research-system
    maturity: active
    branches:
      - ANC-MULTI
      - ANC-VERIFY
      - ANC-ORG
      - ANC-MEMORY
    focus:
      - durable-research-questions
      - empirical-analysis
      - reproducible-artifacts
      - cumulative-evidence

  - id: ordivon-web
