schema_version = 1
registry = "ordivon-conformance"

[protocol]
package = "ordivon-protocol"
version = "0.3.0"
source = "packages/ordivon-protocol"
release = "packages/ordivon-protocol/releases/0.3.0.json"
profiles = [
  "canonical-json-v1",
  "effect-envelope-v1",
  "tool-contract-v1",
  "effect-binding-v1",
  "host-workload-v1",
  "semantic-state-v1",
]

[[projects]]
id = "ordivon-computing"
relationship = "producer"
profiles = ["protocol-source", "semantic-reference", "system-snapshot"]

[[projects]]
id = "ordivon-runtime"
relationship = "semantic-backend"
profiles = ["effect-dispatch-backend", "artifact-evidence", "recovery"]

[[projects]]
id = "ordivon-host"
relationship = "direct-consumer"
profiles = ["task-continuity", "effect-binding-consumer", "runtime-coordination", "host-workload-v1"]
protocol_requirement = "0.3.0"
dependency_file = "pyproject.toml"

[[projects]]
id = "ordivon-world"
relationship = "infrastructure-consumer"
profiles = ["world-interaction", "external-provider", "conditioned-evidence", "remote-reconciliation"]


[[projects]]
id = "ordivon-game"
relationship = "domain-consumer"
profiles = ["deterministic-world", "multi-agent-task", "evidence-replay", "host-workload-v1"]
protocol_requirement = "0.3.0"
vector_manifest = "fixtures/host-workload-v1/manifest.json"

[[projects]]
id = "ordivon-security"
relationship = "research-consumer"
profiles = ["campaign-world", "independent-observer", "reset-replay"]

[[projects]]
id = "ordivon-web"
relationship = "interface-consumer"
profiles = ["project-navigation", "artifact-presentation"]
